services:
  master:
    image: redis:7
    container_name: gs-master
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - redis-net
  replica:
    image: redis:7
    container_name: gs-replica
    command: redis-server --replicaof master 6379 --appendonly yes
    ports:
      - "6380:6379"
    networks:
      - redis-net
  sentinel-1:
    image: redis:7
    container_name: gs-sentinel-1
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel1.conf:/etc/redis/sentinel.conf
    networks:
      - redis-net
  sentinel-2:
    image: redis:7
    container_name: gs-sentinel-2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel.conf
    networks:
      - redis-net
  sentinel-3:
    image: redis:7
    container_name: gs-sentinel-3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel.conf
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge